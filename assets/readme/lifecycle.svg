<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title desc">
  <title id="title">A real prefix, maintained outside chat history</title>
  <desc id="desc">Capture a successful real request. Refresh the eligible prefix only while the native TUI is idle, using a separate bounded request. Resume normal foreground tool work. Provider retention remains outside the extension's control.</desc>
  <rect width="1200" height="304" rx="24" fill="#0B1118"/>
  <g id="lifecycle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="64" y="72" fill="#F4F7FA" font-size="48" font-weight="600" letter-spacing="-1">Real prefix. Separate maintenance.</text>
    <text x="64" y="132" fill="#F4F7FA" font-size="26" font-weight="600">Capture real request</text>
    <text x="464" y="132" fill="#F4F7FA" font-size="26" font-weight="600">Refresh while idle</text>
    <text x="880" y="132" fill="#F4F7FA" font-size="26" font-weight="600">Resume work</text>
    <text x="64" y="168" fill="#9AA9BA" font-size="22">Successful matching reply</text>
    <text x="464" y="168" fill="#F0B879" font-size="22">Paid, bounded, isolated</text>
    <text x="880" y="168" fill="#9AA9BA" font-size="22">Real tools, real usage</text>
    <text x="64" y="266" fill="#F4F7FA" font-size="22">No warm turns in history. No guarantee of provider retention.</text>
  </g>
  <g id="prefix-continuity">
    <path d="M64 212H1136" stroke="#83E7C3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="212" r="8" fill="#83E7C3"/>
    <circle cx="472" cy="212" r="9" fill="#F0B879" stroke="#0B1118" stroke-width="3"/>
    <circle cx="888" cy="212" r="8" fill="#83E7C3"/>
    <path d="M1124 202L1136 212L1124 222" fill="none" stroke="#83E7C3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
